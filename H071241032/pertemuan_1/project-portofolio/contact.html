    <section class="contact-page">
        <div class="contact-data">
            <table border="1" class="contact-table-socialmedia">
                <tr>
                    <th>Email :</th>
                    <th>Telepon :</th>
                    <th>Linkedln :</th>
                    <th>Instagram :</th>

                <tr>
                    <td>diditiqbalalfaruzy27@gmail.com</td>
                    <td>(+62) 812345678</td>

                </tr>
            </table>
            <div class="contact-form">
                <form action="">
                    <label for="nama">Nama :</label>
                    <input type="text" id="nama" name="nama" required>
                    <br><br>

                    <label for="email">Email :</label>
                    <input type="email" id="email" name="email" required>
                    <br><br>

                    <label for="telepon">Telepon :</label>
                    <input type="tel" id="telepon" name="telepon" required>
                    <br><br>

                    <label for="">Tipe Pesan :</label><br>
                    
                    <input type="radio" id="pertanyaan" name="tipe" value="pertanyaan" required>
                    <label for="pertanyaan">Pertanyaan</label>

                    <input type="radio" id="kritik" name="tipe" value="kritik" required>
                    <label for="kritik">Kritik</label>

                    <input type="radio" id="saran" name="tipe" value="saran" required>
                    <label for="saran">Saran</label>

                    <input type="radio" id="kerjasama" name="tipe" value="kerjasama" required>
                    <label for="kerjasama">Kerja sama</label> <br><br>

                        
                    <label for="pesan">Pesan Detail :</label><br>
                    <textarea id="pesan" name="pesan" rows="7" cols="40" required></textarea>
                    <br><br>

    
                    <input type="checkbox" id="setuju" name="setuju" required>
                    <label for="setuju">Saya Setuju</label>
                    <br>

                    <input type="submit" value="Kirim">
                </form>
            </div>
