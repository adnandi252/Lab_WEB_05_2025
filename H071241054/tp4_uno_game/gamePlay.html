<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UNO Arena - Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-800 text-white min-h-screen flex flex-col items-center justify-center">

  <!-- // BAGIAN TARUHAN -->
  <div id="betSection" class="flex flex-col items-center justify-center min-h-screen space-y-6">
    <div class="bg-gray-900 p-6 rounded-lg flex flex-col space-y-4 w-80 text-center shadow-lg border border-gray-700">
      <h1 class="text-2xl font-bold text-white mb-2">Masukkan Taruhan</h1>
      <p class="text-gray-300">Saldo Anda: <span id="balance" class="font-bold text-green-400">$5000</span></p>

      <label for="betAmount" class="text-white">Masukkan jumlah taruhan (min $100):</label>
      <input
        type="number"
        id="betAmount"
        class="p-2 rounded text-black text-center bg-white w-full focus:outline-none focus:ring-2 focus:ring-yellow-400"
        placeholder="100"
        min="100"
      />

      <button
        id="startGameBtn"
        class="bg-yellow-400 text-black font-bold rounded px-6 py-2 hover:bg-yellow-300 transition"
      >
        Mulai Permainan
      </button>

      <p id="warning" class="text-red-500 font-bold hidden">Taruhan minimal $100 atau sebesar saldo sekarang!</p>
    </div>
  </div>

  <!-- BAGIAN GAME (Awalnya disembunyikan) -->
  <div id="gameSection" class="hidden w-full h-full p-4 overflow-y-auto">
    
    <div class="flex flex-col items-center justify-between min-h-screen py-6">
      <h1 class="text-3xl font-extrabold text-white mb-2">PLAYER vs Bot</h1>
      <div class="text-gray-300 mb-4">
        <p>Saldo: $<span id="gameBalance">0</span></p>
        <p>Taruhan: $<span id="gameBet">0</span></p>
        <p>Pot: $<span id="potAmount">0</span></p>
      </div>
      
      <div id="statusMessage" class="text-yellow-400 text-center mb-2 text-lg font-semibold"></div>
      
      <div id="currentColorBox" class="flex items-center gap-2 text-white mb-4">
        Warna aktif:
        <span id="colorIndicator" class="inline-block w-6 h-6 rounded border-2 border-white"></span>
        <span id="colorText" class="font-semibold capitalize"></span>
      </div>
      
      <div id="botCards" class="flex space-x-2 mt-4 mb-6"></div>
      <p class="text-gray-400 text-sm">Kartu Bot: <span id="botCardCount">0</span></p>
      
      <div class="flex space-x-6 items-center mt-6">
        <div id="drawPile" class="cursor-pointer">
          <img src="assets/back.png" class="w-20 h-28 rounded shadow-lg">
          <p id="deckCount" class="text-white text-center mt-1">Sisa: 0</p>
        </div>
        <div id="discardPile" class="w-20 h-28 rounded shadow-lg flex items-center justify-center"></div>
      </div>
      <p class="text-white mt-2">Tumpukan Kartu</p>
      
      <div id="playerCards" class="flex flex-wrap justify-center gap-2 mb-4 mt-8 max-w-4xl"></div>
      <p class="text-gray-400 text-sm mb-4">Kartu Anda: <span id="playerCardCount">0</span></p>
      
      <div class="flex space-x-4 mb-2">
        <button id="drawCard" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded font-semibold transition">Tarik Kartu</button>
        <button id="skipBtn" class="bg-gray-500 hover:bg-gray-600 text-white px-6 py-2 rounded font-semibold hidden transition">Skip Giliran</button>
      </div>
      
      <div class="flex space-x-4">
        <button id="unoBtn" class="bg-red-600 hover:bg-red-700 text-white px-6 py-2 rounded font-bold hidden transition">UNO!</button>
        <button id="callUnoBtn" class="bg-orange-600 hover:bg-orange-700 text-white px-6 py-2 rounded font-semibold hidden transition">Tangkap Bot!</button>
      </div>
      
      <div id="unoTimer" class="text-yellow-400 text-3xl font-bold mt-4 hidden"></div>
      <div id="actionLog" class="text-white text-center mt-4 max-w-md"></div>
    </div>
    
    <!-- Modal Color Picker -->
    <div id="colorPickerModal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50 hidden">
      <div class="bg-white p-8 rounded-lg shadow-2xl text-center">
        <h2 class="text-3xl font-bold text-black mb-6">Pilih Warna</h2>
        <div class="grid grid-cols-2 gap-4">
          <button onclick="selectColorFromModal('red')" class="bg-red-500 hover:bg-red-600 text-white font-bold py-6 px-4 text-xl transition transform hover:scale-105">
            🔴 Merah
          </button>
          <button onclick="selectColorFromModal('blue')" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-6 px-4 text-xl transition transform hover:scale-105">
            🔵 Biru
          </button>
          <button onclick="selectColorFromModal('green')" class="bg-green-500 hover:bg-green-600 text-white font-bold py-6 px-4 text-xl transition transform hover:scale-105">
            🟢 Hijau
          </button>
          <button onclick="selectColorFromModal('yellow')" class="bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-6 px-4 text-xl transition transform hover:scale-105">
            🟡 Kuning
          </button>
        </div>
      </div>
    </div>
    
    <!-- Modal Notifikasi -->
    <div id="notifModal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50 hidden">
      <div id="notifContent" class="bg-gradient-to-br from-blue-600 to-blue-800 p-8 rounded-lg shadow-2xl text-center max-w-md">
        <h2 id="notifTitle" class="text-3xl font-bold text-white mb-4"></h2>
        <p id="notifMessage" class="text-xl text-white mb-6 whitespace-pre-line"></p>
        <button id="notifOkBtn" class="bg-white text-blue-700 px-8 py-3 rounded-lg font-bold text-xl hover:bg-blue-100 transition">OK</button>
      </div>
    </div>
    
    <!-- Modal Confirm Game Over -->
    <div id="gameOverModal" class="fixed inset-0 bg-black bg-opacity-90 flex items-center justify-center z-50 hidden">
      <div id="gameOverContent" class="bg-gradient-to-br from-purple-600 to-purple-900 p-10 rounded-2xl shadow-2xl text-center max-w-lg transform transition-all">
        <div id="gameOverIcon" class="text-6xl mb-4"></div>
        <h2 id="gameOverTitle" class="text-4xl font-extrabold text-white mb-4"></h2>
        <div id="gameOverStats" class="bg-white bg-opacity-20 rounded-lg p-4 mb-6">
          <p class="text-white text-lg mb-2"><span class="font-semibold">Taruhan:</span> $<span id="gameOverBet"></span></p>
          <p class="text-white text-lg mb-2"><span class="font-semibold" id="gameOverResultLabel"></span> $<span id="gameOverResult"></span></p>
          <p class="text-yellow-300 text-2xl font-bold">Saldo Anda: $<span id="gameOverBalance"></span></p>
        </div>
        <p class="text-white text-xl mb-6">Ingin bermain lagi?</p>
        <div class="flex gap-4 justify-center">
          <button id="playAgainBtn" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-8 rounded-lg text-xl transition transform hover:scale-105 shadow-lg">
            ✓ Main Lagi
          </button>
          <button id="exitGameBtn" class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-8 rounded-lg text-xl transition transform hover:scale-105 shadow-lg">
            ✗ Keluar
          </button>
        </div>
      </div>
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
